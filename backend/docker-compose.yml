version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: city_problem_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: city_user
      POSTGRES_PASSWORD: city_pass
      POSTGRES_DB: city_problem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city_user -d city_problem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
